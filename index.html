<!DOCTYPE html>
<html lang="es">    
<head>
    <meta charset="UTF-8">
    <title>Club Deportivo - Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(180deg, #0a122b 0%, #1b2b57 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 18px;
            padding: 32px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            text-align: center;
        }

        .login-card h1 {
            margin: 0 0 12px;
            color: #ffb6c1;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-card p {
            color: #c8d9ff;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .login-card form {
            display: grid;
            gap: 14px;
            text-align: left;
        }

        .login-card label {
            color: #dfe6ff;
            font-size: 0.9rem;
            margin-bottom: 4px;
            display: block;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            outline: none;
        }

        .login-card input:focus {
            border-color: #78c2ff;
            box-shadow: 0 0 0 3px rgba(120, 194, 255, 0.18);
        }

        .login-card button {
            margin-top: 10px;
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            background: linear-gradient(125deg, #83c1ff, #d86eff);
            color: #0e1237;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .login-card button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .links {
            margin-top: 18px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .links a {
            color: #b9d7ff;
            text-decoration: none;
            font-size: 0.88rem;
        }

        .links a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            padding: 10px;
            color: #d8e8ff;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Club Deportivo</h1>
        <p>Accede a tu cuenta</p>

        <form>
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" placeholder="nombre@ejemplo.com" required>

            <label for="password">Contraseña</label>
            <input id="password" type="password" placeholder="********" required>

            <button type="submit">Ingresar</button>
        </form>

        <div class="links">
            <a href="#">¿Olvidaste tu contraseña?</a>
            <a href="#">Registrarse</a>
        </div>
    </div>

    <footer>
        <p>© 2024 Club Deportivo - Todos los derechos reservados</p>
    </footer>
</body>
</html>
