<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <main class="auth-page" aria-label="Login SportClub">
        <section class="auth-card" aria-label="Formulario de inicio de sesión">
            <header class="auth-brand">
                <img class="auth-logo" src="img/logo-sportclub.png" alt="Logo SportClub">
            </header>

            <form class="login-form" method="POST" action="#submit">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn-login">Iniciar sesión</button>

                <nav class="auth-links" aria-label="Accesos rápidos">
                    <ul>
                        <li><a href="index.html">Volver al inicio</a></li>
                        <li><a href="dashboard_usuario.html">Entrar como Usuario (demo)</a></li>
                        <li><a href="dashboard_coach.html">Entrar como Coach (demo)</a></li>
                        <li><a href="dashboard_admin.html">Entrar como Admin (demo)</a></li>
                    </ul>
                </nav>

                <nav class="auth-links auth-links--row" aria-label="Enlaces de autenticación">
                    <a href="recover.html" class="link-recover">Recuperar contraseña</a>
                    <a href="register.html" class="link-register">Registrarse</a>
                </nav>
            </form>
        </section>
    </main>
</body>
</html>
