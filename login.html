<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — SportClub</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card auth-card--with-demo">
            <div class="auth-brand">
                <a href="index.html" aria-label="SportClub — inicio">
                    <img class="auth-logo" src="img/logo-sportclub.png" width="280" height="80" alt="SportClub">
                </a>
            </div>

            <header class="form-header">
                <h2>Iniciar sesión</h2>
                <p>Ingresa con tu correo y contraseña para acceder a tu cuenta.</p>
            </header>

            <form id="login-form" action="#" method="post" aria-label="Formulario de inicio de sesión" novalidate>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" autocomplete="email" required placeholder="tu@correo.com">
                    <p id="email-error" class="field-error is-hidden">Ingresa un correo válido.</p>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
                    <p id="password-error" class="field-error is-hidden">La contraseña es obligatoria.</p>
                </div>
                <button type="submit" class="btn-login">Iniciar sesión</button>
            </form>
            <p id="login-message" class="message is-hidden" role="status" aria-live="polite"></p>

            <nav class="auth-links auth-links--row" aria-label="Enlaces de cuenta">
                <a href="recover.html">¿Olvidaste tu contraseña?</a>
                <a href="register.html">Registrarse</a>
            </nav>

            <p class="form-footer">
                ¿Aún no conoces el club? <a href="index.html">Volver al inicio</a>
            </p>
        </div>
    </div>
    <script src="js/auth.js?v=7"></script>
</body>
</html>
