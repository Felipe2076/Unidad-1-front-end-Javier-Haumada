<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportHub - Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <div class="container">
        <section class="form-section" style="width: 100%;">
            <div class="form-container">
                <header class="form-header">
                    <h2>Recuperar Contraseña</h2>
                    <p>Ingresa tu correo para recibir un enlace de recuperación</p>
                </header>

                <form class="recover-form" method="POST" action="#submit" id="recover-form">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="tu@email.com"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <button type="submit" class="btn-login">
                        Recuperar Contraseña
                    </button>
                </form>

                <div id="message" class="message" style="display: none;">
                    Se ha enviado un enlace de recuperación a su correo.
                </div>

                <nav class="auth-links">
                    <ul>
                        <li>
                            <a href="login.html" class="link-recover">
                                Volver al Login
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </section>
    </div>

    <script>
        document.getElementById('recover-form').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('message').style.display = 'block';
        });
    </script>
</body>
</html>
