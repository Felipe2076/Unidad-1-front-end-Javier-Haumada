<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <main class="auth-page" aria-label="Recuperación de cuenta SportClub">
        <section class="auth-card" aria-label="Recuperación de contraseña">
            <header class="auth-brand">
                <img class="auth-logo" src="img/logo-sportclub.png" alt="Logo SportClub">
            </header>

            <header class="form-header">
                <h2>Recuperar Contraseña</h2>
                <p>Ingresa tu correo para recibir un enlace de recuperación</p>
            </header>

            <form class="recover-form" method="POST" action="#submit" id="recover-form">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <button type="submit" class="btn-login">Recuperar contraseña</button>
            </form>

            <div id="message" class="message is-hidden" role="status" aria-live="polite">
                Se ha enviado un enlace de recuperación a su correo.
            </div>

            <nav class="auth-links" aria-label="Volver">
                <ul>
                    <li>
                        <a href="index.html" class="link-recover">Volver al inicio</a>
                    </li>
                    <li>
                        <a href="login.html" class="link-recover">Volver al login</a>
                    </li>
                </ul>
            </nav>
        </section>
    </main>

    <script>
        document.getElementById('recover-form').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('message').classList.remove('is-hidden');
        });
    </script>
</body>
</html>
