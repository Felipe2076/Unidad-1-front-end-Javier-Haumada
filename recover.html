<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña — SportClub</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-brand">
                <a href="index.html" aria-label="SportClub — inicio">
                    <img class="auth-logo" src="img/logo-sportclub.png" width="280" height="80" alt="SportClub">
                </a>
            </div>

            <header class="form-header">
                <h2>Recuperar contraseña</h2>
                <p>Te enviaremos un enlace para restablecer tu acceso. Revisa también la carpeta de spam.</p>
            </header>

            <form action="#" method="get" aria-label="Solicitud de recuperación de contraseña">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" autocomplete="email" required placeholder="tu@correo.com">
                </div>
                <button type="submit" class="btn-login">Recuperar contraseña</button>
            </form>

            <div class="message" role="status" aria-live="polite">
                Se ha enviado un enlace de recuperación a su correo (simulado en esta versión estática).
            </div>

            <p class="form-footer">
                <a href="login.html">Volver al login</a>
            </p>
        </div>
    </div>
</body>
</html>
