<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro — SportClub</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card auth-card--wide">
            <div class="auth-brand">
                <a href="index.html" aria-label="SportClub — inicio">
                    <img class="auth-logo" src="img/logo-sportclub.png" width="280" height="80" alt="SportClub">
                </a>
            </div>

            <header class="form-header">
                <h2>Crear cuenta</h2>
                <p>Completa los datos obligatorios. Los demás campos nos ayudan a personalizar tu experiencia.</p>
            </header>

            <form id="register-form" action="#" method="post" aria-label="Formulario de registro" novalidate>
                <div class="form-group">
                    <label for="email">Correo electrónico <span class="muted">(obligatorio)</span></label>
                    <input type="email" id="email" name="email" autocomplete="email" required placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña <span class="muted">(obligatorio)</span></label>
                    <input type="password" id="password" name="password" autocomplete="new-password" required placeholder="Mínimo 8 caracteres">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña <span class="muted">(obligatorio)</span></label>
                    <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required placeholder="Repite tu contraseña">
                </div>
                <div class="form-group">
                    <label for="birthDate">Fecha de nacimiento</label>
                    <input type="date" id="birthDate" name="birthDate" placeholder="dd/mm/aaaa">
                </div>
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" name="name" autocomplete="name" placeholder="Tu nombre completo">
                </div>
                <div class="form-group">
                    <label for="age">Edad</label>
                    <input type="number" id="age" name="age" min="12" max="120" placeholder="Ej. 28">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="practiceDeporte" name="practiceDeporte" value="si">
                        ¿Practicas deporte?
                    </label>
                </div>
                <div class="form-group">
                    <label for="typeDeporte">Tipo de deporte</label>
                    <input type="text" id="typeDeporte" name="typeDeporte" placeholder="Ej. running, natación…">
                </div>
                <div class="form-group">
                    <label for="objectivePersonal">Objetivo personal</label>
                    <input type="text" id="objectivePersonal" name="objectivePersonal" placeholder="Ej. mejorar resistencia">
                </div>
                <div class="form-group">
                    <label for="level">Nivel</label>
                    <select id="level" name="level">
                        <option value="" selected>Selecciona una opción</option>
                        <option value="principiante">Principiante</option>
                        <option value="intermedio">Intermedio</option>
                        <option value="avanzado">Avanzado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="infoAdicional">Información adicional <span class="muted">(opcional)</span></label>
                    <textarea id="infoAdicional" name="infoAdicional" placeholder="Lesiones, horarios preferidos, comentarios…"></textarea>
                </div>
                <button type="submit" class="btn-login">Registrarse</button>
            </form>
            <p id="register-message" class="message is-hidden" role="status" aria-live="polite"></p>

            <p class="form-footer">
                ¿Ya tienes cuenta? <a href="login.html">Volver al login</a>
            </p>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
