<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Registro</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <main class="auth-page" aria-label="Registro SportClub">
        <section class="auth-card" aria-label="Formulario de registro">
            <header class="auth-brand">
                <img class="auth-logo" src="img/logo-sportclub.png" alt="Logo SportClub">
            </header>

            <header class="form-header">
                <h2>Registro de usuario</h2>
                <p>Únete a nuestra comunidad deportiva</p>
            </header>

            <form class="register-form" method="POST" action="#submit">
                <div class="form-group">
                    <label for="email">Correo electrónico *</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña *</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Tu nombre completo"
                    >
                </div>

                <div class="form-group">
                    <label for="age">Edad</label>
                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="1"
                        placeholder="Tu edad"
                    >
                </div>

                <div class="form-group">
                    <label for="practices-sport">
                        <input type="checkbox" id="practices-sport" name="practices-sport"> ¿Practicas deporte?
                    </label>
                </div>

                <div class="form-group">
                    <label for="sport-type">Tipo de deporte</label>
                    <select id="sport-type" name="sport-type">
                        <option value="">Selecciona</option>
                        <option value="football">Fútbol</option>
                        <option value="basketball">Baloncesto</option>
                        <option value="tennis">Tenis</option>
                        <option value="running">Running</option>
                        <option value="swimming">Natación</option>
                        <option value="other">Otro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="objective">Objetivo personal</label>
                    <input
                        type="text"
                        id="objective"
                        name="objective"
                        placeholder="Ej: Mejorar condición física, competir"
                    >
                </div>

                <div class="form-group">
                    <label for="level">Nivel</label>
                    <select id="level" name="level">
                        <option value="">Selecciona</option>
                        <option value="beginner">Principiante</option>
                        <option value="intermediate">Intermedio</option>
                        <option value="advanced">Avanzado</option>
                    </select>
                </div>

                <button type="submit" class="btn-login">Registrarse</button>
            </form>

            <nav class="auth-links" aria-label="Volver">
                <ul>
                    <li>
                        <a href="index.html" class="link-register">Volver al inicio</a>
                    </li>
                    <li>
                        <a href="login.html" class="link-register">Volver al login</a>
                    </li>
                </ul>
            </nav>
        </section>
    </main>
</body>
</html>
