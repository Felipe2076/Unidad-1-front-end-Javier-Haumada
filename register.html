<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportHub - Registro</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <div class="container">
        <section class="form-section" style="width: 100%;">
            <div class="form-container">
                <header class="form-header">
                    <h2>Registro de Usuario</h2>
                    <p>Únete a nuestra comunidad deportiva</p>
                </header>

                <form class="register-form" method="POST" action="#submit">
                    <div class="form-group">
                        <label for="email">Correo Electrónico *</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="tu@email.com"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña *</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required
                            autocomplete="new-password"
                        >
                    </div>

                    <div class="form-group">
                        <label for="name">Nombre</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Tu nombre completo"
                        >
                    </div>

                    <div class="form-group">
                        <label for="age">Edad</label>
                        <input
                            type="number"
                            id="age"
                            name="age"
                            min="1"
                            placeholder="Tu edad"
                        >
                    </div>

                    <div class="form-group">
                        <label for="practices-sport">
                            <input type="checkbox" id="practices-sport" name="practices-sport"> ¿Practicas deporte?
                        </label>
                    </div>

                    <div class="form-group">
                        <label for="sport-type">Tipo de Deporte</label>
                        <select id="sport-type" name="sport-type">
                            <option value="">Selecciona</option>
                            <option value="football">Fútbol</option>
                            <option value="basketball">Baloncesto</option>
                            <option value="tennis">Tenis</option>
                            <option value="running">Running</option>
                            <option value="swimming">Natación</option>
                            <option value="other">Otro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="objective">Objetivo Personal</label>
                        <input
                            type="text"
                            id="objective"
                            name="objective"
                            placeholder="Ej: Mejorar condición física, competir"
                        >
                    </div>

                    <div class="form-group">
                        <label for="level">Nivel</label>
                        <select id="level" name="level">
                            <option value="">Selecciona</option>
                            <option value="beginner">Principiante</option>
                            <option value="intermediate">Intermedio</option>
                            <option value="advanced">Avanzado</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-login">
                        Registrarse
                    </button>
                </form>

                <nav class="auth-links">
                    <ul>
                        <li>
                            <a href="login.html" class="link-register">
                                Volver al Login
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </section>
    </div>
</body>
</html>
